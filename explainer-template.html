<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Concept Explainer Template</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Custom Colors - Customize these for each explainer */
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 28, 41, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            --badge-rgba: 59, 130, 246;
            --badge-rgba2: 139, 92, 246;
            
            /* General utility colors */
            --code-bg: #111827;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 3rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 840px;
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 3.5rem;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: var(--accent-gradient);
            filter: blur(100px);
            opacity: 0.25;
            pointer-events: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(var(--badge-rgba), 0.1) 0%, rgba(var(--badge-rgba2), 0.1) 100%);
            color: var(--accent-primary);
            border: 1px solid rgba(var(--badge-rgba), 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.03em;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Glassmorphic Card Sections */
        section, .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        section:hover, .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px rgba(var(--badge-rgba), 0.05);
            border-color: rgba(var(--badge-rgba), 0.3);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.6rem;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        strong {
            color: var(--text-main);
            font-weight: 600;
        }

        ul, ol {
            margin-left: 1.5rem;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
        }

        li {
            margin-bottom: 0.5rem;
        }

        /* Grid Layout (Prevents Overflow) */
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Citations & Links */
        .citation {
            font-size: 0.85rem;
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent-primary);
            transition: color 0.2s, border-bottom 0.2s;
        }

        .citation:hover {
            color: var(--accent-secondary);
            border-bottom-color: var(--accent-secondary);
        }

        /* Code Block styling */
        pre {
            background-color: var(--code-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1.25rem;
            overflow-x: auto;
            margin: 1.25rem 0;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        p > code {
            background-color: rgba(255, 255, 255, 0.06);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Try This / Notes / Tip Callouts */
        .callout {
            border-left: 4px solid var(--accent-primary);
            background: rgba(59, 130, 246, 0.05);
            padding: 1.25rem;
            border-radius: 0 12px 12px 0;
            margin: 1.5rem 0;
        }

        .callout.tip {
            border-left-color: var(--accent-secondary);
            background: rgba(139, 92, 246, 0.05);
        }

        .callout-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Interactive Quiz Styles */
        .quiz-container {
            margin-top: 1.5rem;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .question-card:last-child {
            margin-bottom: 0;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.75rem;
            color: var(--text-main);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">Category / Tag</div>
            <h1>Concept Title</h1>
            <p class="subtitle">Descriptive summary of learning goals.</p>
        </header>

        <!-- Section 1 -->
        <section id="section-1">
            <h2>1. Topic Heading</h2>
            <p>Topic introduction and text...</p>
        </section>

        <!-- Section 2 -->
        <section id="section-2">
            <h2>2. Another Topic</h2>
            <p>Topic introduction and text...</p>
        </section>

        <!-- Self-Check Quiz -->
        <section id="quiz">
            <h2>Self-Check Quiz</h2>
            <div class="quiz-container">
                <!-- Question Cards and JS checking go here -->
            </div>
        </section>

        <footer>
            <p>Built with ❤️ for [Exercise Name]. Track: Go | Exercise: [Exercise Name]</p>
        </footer>
    </div>
</body>
</html>
